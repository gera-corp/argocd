# Статические PersistentVolume, усыновлённые драйвером csi-driver-nfs.
#
# Тома НЕ провизионируются динамически: каждый указывает на существующий каталог
# на NFS 192.168.1.155:/k8s-storage, созданный ещё старым провизионером. Данные
# при переходе не копировались.
#
# Эти объекты обязаны лежать в Git: пять PVC жёстко привязаны через volumeName,
# а PVC с volumeName динамически не провизионится — без этих манифестов
# пересборка кластера оставила бы их Pending навсегда.
#
# reclaimPolicy: Retain — удаление PVC каталог на NFS не трогает.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: csi-influxdb-data-influxdb-0
spec:
  capacity:
    storage: 5G
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: influxdb
    name: data-influxdb-0
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.1.155#k8s-storage/influxdb-data-influxdb-0-pvc-5fffe181-3079-473a-90a4-193bc024725f#
    volumeAttributes:
      server: 192.168.1.155
      share: /k8s-storage/influxdb-data-influxdb-0-pvc-5fffe181-3079-473a-90a4-193bc024725f
---
