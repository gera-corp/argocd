apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
stringData:
  telegram-bot-token: vault:secret/data/alertmanager#telegram_token
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: metrics-basic-auth
  namespace: monitoring
stringData:
  username: prometheus
  password: vault:secret/data/metrics#basic_auth_password
type: Opaque
---
# Пароль админа Grafana. Без него чарт генерирует случайный пароль ПРИ КАЖДОМ
# рендере, ArgoCD пишет его в секрет на каждой синхронизации, а grafana.db
# хранит самый первый — из-за чего сайдкары вечно получали 401 на
# /api/admin/provisioning/*/reload.
#
# Значение положить в Vault до применения:
#
#   vault kv put secret/grafana admin_password=...
#
# Чарт направлен на этот секрет через grafana.admin.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
stringData:
  admin-user: admin
  admin-password: vault:secret/data/grafana#admin_password
type: Opaque
