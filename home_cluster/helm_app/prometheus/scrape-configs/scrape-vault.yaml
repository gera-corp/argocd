apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: vault-cluster
  namespace: monitoring
  labels:
    prometheus: vault
    release: prom
spec:
  # Ноды слушают только TLS с сертификатом внутреннего корня home.local,
  # которого нет в доверенных у Prometheus. Проверку не включаем осознанно:
  # по всему этому пути она выключена, чтобы просрочка сертификата не рвала
  # то, чем его же и чинят.
  scheme: HTTPS
  tlsConfig:
    insecureSkipVerify: true
  metricsPath: /v1/sys/metrics
  staticConfigs:
    - labels:
        job: vault-cluster
      targets:
        - 192.168.1.160:8200
        - 192.168.1.161:8200
        - 192.168.1.162:8200
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: vault-cluster-nodes
  namespace: monitoring
  labels:
    prometheus: vault
    release: prom
spec:
  scheme: HTTP
  metricsPath: /metrics
  staticConfigs:
    - labels:
        job: vault-cluster
      targets:
        - 192.168.1.160:9100
        - 192.168.1.161:9100
        - 192.168.1.162:9100
