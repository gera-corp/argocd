apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: vpn-server
  namespace: monitoring
  labels:
    prometheus: test
    release: prom
spec:
  scheme: HTTPS
  metricsPath: /node/metrics
  basicAuth:
    username:
      name: metrics-basic-auth
      key: username
    password:
      name: metrics-basic-auth
      key: password
  staticConfigs:
    - labels:
        job: VPN-server
      targets:
        - trol.geracorp.org:8844
