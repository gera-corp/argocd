# Значение резолвится в момент admission вебхуком bank-vaults, в git попадает
# только ссылка на Vault. Раньше этот же секрет создавал Terraform ресурсом
# kubernetes_secret — с той же самой ссылкой, так что содержимое не меняется.
#
# Токен нужен решателю DNS-01 в ClusterIssuer letsencrypt-cloud-production:
# им cert-manager кладёт запись _acme-challenge в зону geracorp.work. Это НЕ
# тот же токен, что у external-dns — другой ключ в том же пути Vault.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
stringData:
  api-token: vault:secret/data/cloudflare-api-token-secret#geracorp.work
type: Opaque
