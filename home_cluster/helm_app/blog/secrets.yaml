# Secrets for the blog. Values are Vault references resolved at runtime by the
# bank-vaults webhook (init container copy-vault-env). Create the Vault secret
# before syncing:
#
#   vault kv put secret/data/blog \
#     session_secret="$(openssl rand -hex 32)" \
#     admin_password="<password>"
#
apiVersion: v1
kind: Secret
metadata:
  name: blog-secrets
  namespace: blog
stringData:
  SESSION_SECRET: "vault:secret/data/blog#session_secret"
  ADMIN_USERNAME: "gera"
  ADMIN_PASSWORD: "vault:secret/data/blog#admin_password"
type: Opaque
