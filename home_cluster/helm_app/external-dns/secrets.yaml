# Значение резолвится в момент admission вебхуком bank-vaults, в git попадает
# только ссылка на Vault. Раньше этот же секрет создавал Terraform ресурсом
# kubernetes_secret — с той же самой ссылкой, так что содержимое не меняется.
#
# Токен читает external-dns, чтобы править записи в зоне local.geracorp.work.
# Это НЕ тот же токен, что у cert-manager: там другой ключ в том же пути Vault
# и другое значение.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-key
  namespace: external-dns
stringData:
  apiKey: vault:secret/data/cloudflare-api-token-secret#api_token
type: Opaque
