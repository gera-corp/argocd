# Application manifest
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: statedash
spec:
  destination:
    name: in-cluster
    namespace: statedash
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    # Тома усыновлены CSI-драйвером статически; volumeName проставляется
    # при привязке и в чарте отсутствовать не может.
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
  source:
    # OCI chart, published from the same repository as the image
    repoURL: ghcr.io/gera-corp-org/charts
    chart: statedash
    # The chart now carries the application's own number, so this follows the
    # major: 1.3.0 installs Statedash 1.3.0. A 2.x chart would mean an upgrade
    # that needs reading about first, which is why it is not "*".
    targetRevision: 1.*
    helm:
      valuesObject:
        opnsense:
          url: https://192.168.1.1:4443
          interfaces: lan,wireguard
          # the certificate is issued for the hostname above, which resolves on
          # the LAN; set to false if it stops matching
          tlsVerify: true
          # credentials come from secrets.yaml beside this file, which the
          # bank-vaults webhook fills in from Vault
          existingSecret: statedash-opnsense

        # Internal name only: the dashboard shows the whole network — hosts,
        # addresses, who talks to whom — so it has no business on a publicly
        # resolvable one. The certificate comes from the Cloudflare DNS-01
        # issuer, which is what lets a name that never answers from the
        # internet still get a real certificate.
        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-cloud-production
          hosts:
            - host: statedash.local.geracorp.work
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - statedash.local.geracorp.work
              secretName: statedash-tls

        persistence:
          enabled: true
          size: 64Mi

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
