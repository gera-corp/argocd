# Resolved at admission time by the bank-vaults secrets webhook, so only the
# reference is ever committed here. Put the values in Vault first:
#
#   vault kv put secret/statedash \
#     opnsense_key=... \
#     opnsense_secret=...
#
# The keys are named as the container expects them; the chart is pointed at this
# secret with opnsense.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: statedash-opnsense
  namespace: statedash
stringData:
  OPNSENSE_KEY: vault:secret/data/statedash#opnsense_key
  OPNSENSE_SECRET: vault:secret/data/statedash#opnsense_secret
type: Opaque
