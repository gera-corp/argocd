# Application manifest
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw
spec:
  destination:
    name: in-cluster
    namespace: openclaw
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: "*"
      kind: ConfigMap
      name: openclaw-config
      jsonPointers:
        - /data
  source:
    repoURL: 'https://serhanekicii.github.io/openclaw-helm'
    chart: openclaw
    targetRevision: 1.5.*
    helm:
      skipCrds: false
      valuesObject:
        app-template:
          openclawVersion: "2026.5.12"
          defaultPodOptions:
            nodeSelector:
              kubernetes.io/arch: "arm64"
            tolerations:
              - key: "dedicated"
                operator: "Equal"
                value: "arm64"
                effect: "NoSchedule"
          controllers:
            main:
              initContainers:
                # Fixes PVC root ownership (root:users → node:node) so the main
                # container's exec tool can chmod its workspace. Idempotent.
                fix-perms:
                  image:
                    repository: busybox
                    tag: "1.37"
                  command:
                    - sh
                    - -c
                    - chown 1000:1000 /home/node/.openclaw && chmod 700 /home/node/.openclaw
                  securityContext:
                    runAsUser: 0
                    runAsNonRoot: false
                    readOnlyRootFilesystem: true
                    allowPrivilegeEscalation: false
                    capabilities:
                      add:
                        - CHOWN
                        - FOWNER
                      drop:
                        - ALL
              containers:
                main:
                  env:
                    NPM_CONFIG_CACHE: /home/node/.openclaw/.npm
                  envFrom:
                    - secretRef:
                        name: openclaw-env-secret
                  resources:
                    requests:
                      # @schema type:string;default:200m
                      cpu: 200m
                      # @schema type:string;default:512Mi
                      memory: 512Mi
                    limits:
                      # @schema type:string;default:2000m
                      cpu: 2000m
                      # @schema type:string;default:2Gi
                      memory: 4Gi
          persistence:
            data:
              advancedMounts:
                main:
                  fix-perms:
                    - path: /home/node/.openclaw
