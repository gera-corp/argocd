# Значение резолвится в момент admission вебхуком bank-vaults, в git попадает
# только ссылка на Vault. Положить пароль в Vault до применения:
#
#   vault kv put secret/seafile mariadb_root_password=...
#
# Раньше этот пароль генерировал подчарт MariaDB — СЛУЧАЙНЫЙ при каждом
# рендере. Под ArgoCD это означало бы перезапись секрета на каждой
# синхронизации, а сама база при этом продолжала бы хранить старый пароль.
# Поэтому чарт направлен на этот секрет через mariadb.auth.existingSecret.
# Секрет читают оба StatefulSet: seafile-mariadb и seafile.
apiVersion: v1
kind: Secret
metadata:
  name: seafile-mariadb
  namespace: seafile
stringData:
  mariadb-root-password: vault:secret/data/seafile#mariadb_root_password
  # Пароль пользователя seafile к базе. До чарта 0.2.0 он передавался
  # открытым текстом в env через valuesObject и был виден в spec любого
  # пода; теперь чарт читает его отсюда через secretKeyRef.
  mariadb-password: vault:secret/data/seafile#mariadb_password
type: Opaque
---
# До 0.2.0 этот секрет создавал подчарт Redis и владел им сам Application
# seafile. Подчарт удалён, и без переноса сюда prune снёс бы секрет вместе
# с подчартом — а его читают оба пода: сервер Redis берёт отсюда пароль для
# --requirepass, Seafile — для REDIS_PASSWORD. Один источник истины вместо
# прежней схемы, где сервер брал пароль из values, Seafile из Vault, и
# совпадать они были обязаны вручную.
apiVersion: v1
kind: Secret
metadata:
  name: seafile-redis
  namespace: seafile
stringData:
  redis-password: vault:secret/data/seafile#REDIS_PASSWORD
type: Opaque
