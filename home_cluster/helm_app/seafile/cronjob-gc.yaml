# GC для Seafile: раз в неделю подчищает блоки, на которые больше не ссылается
# ни один коммит. Создан когда-то руками через kubectl, в Git забран 2026-08-30.
#
# Раньше джоба ходила в под seafile через kubectl exec: гасила seahub и seafile,
# прогоняла seaf-gc.sh и поднимала сервисы обратно через kubectl rollout restart.
# Это требовало отдельного образа bitnami/kubectl, ServiceAccount и прав на exec
# и patch StatefulSet.
#
# Ничего этого не нужно: seafserv-gc при базе MySQL сам переходит в онлайновый
# режим — в логе каждого запуска стоит "Database is MySQL/Postgre/Oracle, use
# online GC". Останавливать сервер незачем, а значит незачем и перезапускать.
# Проверка validate_already_running в seaf-gc.sh 13.0.25 объявлена, но не
# вызывается.
#
# Теперь джоба запускает seafserv-gc в своём поде из того же образа seafile и
# работает с данными напрямую. Обёртку seaf-gc.sh не используем: она требует
# JWT_PRIVATE_KEY, который нужен серверу, но не сборщику мусора, и зависит от
# симлинков, которые создаёт entrypoint образа.
#
# Том подключён отдельным PV в режиме ReadWriteMany поверх того же каталога NFS,
# что и seafile-data-seafile-0: RWO-том уже занят подом seafile-0, а онлайновый
# GC рассчитан на параллельную работу с сервером. PV лежит в
# home_cluster/storage/persistent-volumes.yaml рядом с остальными.
#
# Тег образа обязан совпадать с тем, что стоит у StatefulSet в application.yaml:
# пути внутри контейнера версионированы.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seafile-gc-data
  namespace: seafile
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: nfs-csi
  volumeName: csi-seafile-gc-data
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seafile-gc
  namespace: seafile
spec:
  schedule: 0 3 * * 0
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # Джобе больше не нужен доступ к API кластера. serviceAccountName
          # указан явно: прежний seafile-gc остался бы в объекте — home-lab
          # применяет манифесты client-side apply, а он удаляет только те поля,
          # что были в его же last-applied.
          serviceAccountName: default
          automountServiceAccountToken: false
          containers:
          - name: gc
            image: docker.io/seafileltd/seafile-mc:13.0.25
            command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # seafile-server-latest — симлинк, который создаёт entrypoint
              # образа; мы его не запускаем, поэтому берём версию глобом.
              INSTALL=$(echo /opt/seafile/seafile-server-*)
              export LD_LIBRARY_PATH="$INSTALL/seafile/lib:$INSTALL/seafile/lib64"

              echo "=== $(date) — Seafile GC started ($INSTALL) ==="
              "$INSTALL/seafile/bin/seafserv-gc" \
                -d /shared/seafile/seafile-data \
                -F /shared/seafile/conf
              echo "=== $(date) — Seafile GC completed ==="
            env:
            # Настройки базы seafserv-gc читает только из окружения:
            # seafile.conf в этой установке содержит лишь порт fileserver.
            - name: SEAFILE_MYSQL_DB_HOST
              value: seafile-mariadb.seafile.svc.cluster.local
            - name: SEAFILE_MYSQL_DB_PORT
              value: '3306'
            - name: SEAFILE_MYSQL_DB_USER
              value: seafile
            - name: SEAFILE_MYSQL_DB_PASSWORD
              value: seafile
            - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
              value: ccnet_db
            - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
              value: seafile_db
            - name: SEAFILE_LOG_TO_STDOUT
              value: 'true'
            volumeMounts:
            - name: seafile-data
              mountPath: /shared
          volumes:
          - name: seafile-data
            persistentVolumeClaim:
              claimName: seafile-gc-data
