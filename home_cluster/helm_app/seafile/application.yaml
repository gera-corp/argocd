# История: релиз был перенесён из Terraform в ArgoCD без переустановки —
# три StatefulSet усыновлялись на месте, поэтому чарт был закреплён на теге
# v0.1.5 и Application обязан был рендерить ровно то же, что уже стояло в
# кластере. Это условие снято: чарт 0.2.0 меняет селекторы, и объекты
# пересозданы намеренно (см. ниже).
#
# Почему пришлось уйти с 0.1.5: образы всех трёх подчартов Bitnami удалены
# из Docker Hub, и чарт перестал устанавливаться с нуля. В кластере он жил
# только потому, что образы уже были стянуты, а repository вручную переведён
# на bitnamilegacy. Чарт 0.2.0 выбрасывает подчарты и разворачивает MariaDB и
# Redis собственными шаблонами на официальных образах с закреплёнными
# версиями. memcached удалён: с Seafile 13 кэшем стал Redis.
#
# Пересоздание объектов при переходе. Три поля неизменяемы, поэтому
# обновление на месте невозможно: объекты удалялись вручную обычным
# каскадным удалением, после чего selfHeal пересоздал их из этой спеки.
# Orphan здесь не годится — селекторы новые, старые поды под них не
# подходят, а имена совпадают, и новый StatefulSet встаёт на AlreadyExists:
#   - selector StatefulSet seafile: добавлена метка app.kubernetes.io/component,
#     без неё селектор совпадал с подами mariadb и redis;
#   - selector StatefulSet seafile-mariadb: раньше метки подчарта Bitnami;
#   - clusterIP Service seafile: был headless, стал обычным ClusterIP.
# PVC при этом не трогались: имена seafile-data-seafile-0 и
# data-seafile-mariadb-0 в 0.2.0 совпадают со старыми, у обоих стоит
# helm.sh/resource-policy: keep. Данные сохранены.
#
# StatefulSet seafile-redis-master заменён на seafile-redis, его PVC
# redis-data-seafile-redis-master-0 осиротел — это кэш, содержимое не нужно,
# том можно удалить вручную.
#
# Пароли больше не передаются открытым текстом. Раньше SEAFILE_MYSQL_DB_PASSWORD
# лежал прямо здесь и был виден в spec любого пода; теперь чарт читает его из
# секрета seafile-mariadb (см. secrets.yaml рядом) через secretKeyRef.
# Учётные данные администратора и JWT задаются vault-ссылками в структурных
# полях values — почему не через extraEnv, объяснено ниже по месту.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seafile
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Оставлено вместе с ServerSideApply. Исходная причина отпала — она была
    # в подчарте MariaDB, который рендерил requests.memory как 1024Mi против
    # канонических 1Gi и держал приложение вечно OutOfSync; собственный
    # шаблон 0.2.0 по умолчанию resources не задаёт вовсе.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  destination:
    name: in-cluster
    namespace: seafile
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
  source:
    repoURL: 'https://github.com/gera-corp-org/helm-seafile.git'
    targetRevision: v0.3.0
    path: '.'
    helm:
      valuesObject:
        replicaCount: 1
        image:
          repository: docker.io/seafileltd/seafile-mc
          tag: '13.0.25'
        seafile:
          serverHostname: sea.geracorp.org
          protocol: https
          timeZone: Etc/UTC
          webdav:
            enabled: true
          # Ссылки кладутся в структурные поля, а не в extraEnv. Чарт
          # положит их в свой секрет seafile, а vault-secrets-webhook
          # развернёт на admission — так же, как он это делает для
          # seafile-mariadb.
          #
          # Через extraEnv было бы нельзя: чарт уже выставляет эти три
          # переменные из своего секрета, extraEnv добавил бы их вторым
          # разом, и в env оказалось бы по два вхождения с одним именем.
          # Helm такое проглатывает (strategic merge схлопывает запись по
          # имени), а ArgoCD с ServerSideApply падает на построении
          # типизированного патча: "duplicate entries for key". Ровно та же
          # причина, по которой ниже нет SEAFILE_MYSQL_DB_HOST.
          admin:
            email: vault:secret/data/seafile#SEAFILE_ADMIN_EMAIL
            password: vault:secret/data/seafile#SEAFILE_ADMIN_PASSWORD
          jwtPrivateKey: vault:secret/data/seafile#JWT_PRIVATE_KEY
        database:
          enabled: true
          user: seafile
          # Секрет описан в secrets.yaml рядом и содержит оба ключа:
          # mariadb-root-password и mariadb-password. Пока existingSecret
          # задан, чарт свой секрет не создаёт и root-пароль не перезаписывает.
          existingSecret: seafile-mariadb
          persistence:
            size: 8Gi
            storageClass: nfs-csi
            # Том достался от подчарта Bitnami, который держал датадир в
            # подкаталоге data. Официальный образ ищет данные прямо в
            # /var/lib/mysql, видит там чужую раскладку, считает том пустым
            # и инициализирует базу заново рядом со старой — все логины
            # начинают отдавать Access denied, хотя данные целы. subPath
            # монтирует подкаталог и оставляет раскладку тома как есть,
            # так что откат на чарт, который её создал, тоже найдёт данные.
            subPath: data
        cache:
          provider: redis
          enabled: true
          # Один источник истины: и сервер Redis, и Seafile читают этот секрет.
          # Раньше сервер брал пароль из values, а Seafile из Vault, и они
          # обязаны были совпадать вручную.
          existingSecret: seafile-redis
        persistence:
          size: 10Gi
          storageClass: nfs-csi
        ingress:
          enabled: true
          className: traefik
          host: sea.geracorp.org
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-cloud-production
          tls:
            enabled: true
            secretName: seafile-tls
          traefik:
            # В 0.1.5 Middleware создавалась, но ни один Ingress на неё не
            # ссылался, то есть буферизация не работала. В 0.2.0 чарт вешает
            # аннотацию router.middlewares — это нужно для загрузки крупных
            # файлов через WebDAV.
            buffering: true
