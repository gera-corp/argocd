# Перенесено из Terraform в ArgoCD без переустановки: релиз helm уже стоит
# в кластере, adopt происходит "на месте" — Application должен рендерить
# ровно то же самое, иначе три StatefulSet с 16 ГБ пользовательских данных
# пересоздадутся.
#
# Чарт свой, публичный, закреплён на теге v0.1.5, а не на branch: master на
# коммит впереди и добавляет traefik middleware, которой в кластере нет —
# усыновление зависит от идентичного рендера.
#
# storageClassName в values — nfs-csi, хотя в values самого релиза Terraform
# до сих пор значится удалённый openmediavault-nfs-client: StatefulSet'ы
# были пересозданы хирургически во время миграции на CSI, а values релиза
# при этом не обновлялись.
#
# mariadb.auth.existingSecret указывает на секрет из secrets.yaml рядом —
# без этого подчарт MariaDB генерирует пароль root заново при каждом
# рендере, и чарт перестаёт делать это сам.
#
# Первая синхронизация выполнялась вручную: три StatefulSet усыновлены
# на месте, UID объектов и PVC не изменились. После проверки включён
# автоматический режим.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seafile
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Без этого приложение вечно OutOfSync на двух StatefulSet: подчарт
    # MariaDB рендерит requests.memory как 1024Mi, а API-сервер хранит
    # канонические 1Gi, и обычный diff ArgoCD считает это расхождением,
    # которое никаким apply не устранить. ServerSideDiff сравнивает не текст
    # манифеста, а результат server-side apply в режиме dry-run, где
    # величины уже приведены к каноническому виду.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  destination:
    name: in-cluster
    namespace: seafile
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
  source:
    repoURL: 'https://github.com/gera-corp-org/helm-seafile.git'
    targetRevision: v0.1.5
    path: '.'
    helm:
      valuesObject:
        ingress:
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-cloud-production
            kubernetes.io/spec.ingressClassName: traefik
          host: sea.geracorp.org
          tls:
            host: sea.geracorp.org
            secretName: seafile-tls
        mariadb:
          enabled: true
          global:
            defaultStorageClass: nfs-csi
          image:
            repository: bitnamilegacy/mariadb
          primary:
            resourcesPreset: medium
          auth:
            existingSecret: seafile-mariadb
        memcached:
          enabled: false
          global:
            security:
              allowInsecureImages: true
          image:
            repository: bitnamilegacy/memcached
          resourcesPreset: small
          serviceFqdn: seafile-memcached
        redis:
          architecture: standalone
          enabled: true
          global:
            redis:
              password: redis
            security:
              allowInsecureImages: true
            storageClass: nfs-csi
          image:
            repository: bitnamilegacy/redis
          master:
            resourcesPreset: small
        seafile:
          database:
            hostname: seafile-mariadb.seafile.svc.cluster.local
            rootPasswordSecret:
              key: mariadb-root-password
              name: seafile-mariadb
          environment:
          - name: TIME_ZONE
            value: Etc/UTC
          - name: INIT_SEAFILE_ADMIN_EMAIL
            value: vault:secret/data/seafile#SEAFILE_ADMIN_EMAIL
          - name: INIT_SEAFILE_ADMIN_PASSWORD
            value: vault:secret/data/seafile#SEAFILE_ADMIN_PASSWORD
          - name: SEAFILE_SERVER_HOSTNAME
            value: sea.geracorp.org
          - name: JWT_PRIVATE_KEY
            value: vault:secret/data/seafile#JWT_PRIVATE_KEY
          # SEAFILE_MYSQL_DB_HOST здесь намеренно нет: чарт добавляет его сам
          # из seafile.database.hostname сразу после этого списка. В values
          # релиза он был продублирован — helm это проглатывал (strategic merge
          # схлопывал запись по имени), а ArgoCD на дубликате ключа в env падает
          # с ComparisonError и вообще не может посчитать diff.
          - name: SEAFILE_MYSQL_DB_USER
            value: seafile
          - name: SEAFILE_MYSQL_DB_PASSWORD
            value: seafile
          - name: SEAFILE_MYSQL_DB_PORT
            value: '3306'
          - name: SEAFILE_MYSQL_DB_CCNET_DB_NAME
            value: ccnet_db
          - name: SEAFILE_MYSQL_DB_SEAFILE_DB_NAME
            value: seafile_db
          - name: SEAFILE_MYSQL_DB_SEAHUB_DB_NAME
            value: seahub_db
          - name: CACHE_PROVIDER
            value: redis
          - name: REDIS_HOST
            value: seafile-redis-master
          - name: REDIS_PORT
            value: '6379'
          - name: REDIS_PASSWORD
            value: vault:secret/data/seafile#REDIS_PASSWORD
          - name: SEAFILE_SERVER_PROTOCOL
            value: https
          image: docker.io/seafileltd/seafile-mc:13.0.25
          pause: false
          persistence:
            existingClaim: {}
            size: 10Gi
            storageClassName: nfs-csi
          podSecurityContext: {}
          securityContext: {}
          webdav:
            enabled: true
